name: Deploy Onter AI & Argon Hub

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy changes to host
        run: |
          echo "=== 🚀 Starting Automatic Deployment ==="
          cd /opt/onter-ai
          git pull origin main
          cp -r /opt/onter-ai/argon-engine/* /opt/argon-engine/
          sudo systemctl restart argon-engine onter-ai
          echo "=== 🩺 Verifying Service Status ==="
          sudo systemctl is-active --quiet argon-engine && echo "Argon Engine: OK" || (echo "Argon Engine: FAILED" && exit 1)
          sudo systemctl is-active --quiet onter-ai && echo "Onter AI: OK" || (echo "Onter AI: FAILED" && exit 1)
          echo "=== ✅ Deployment completed successfully! ==="
