services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: onter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onter_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onter_pg_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-onter_ai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onter_ai} -d ${POSTGRES_DB:-onter_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  onter-ai:
    build: .
    container_name: onter-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  postgres_data:
